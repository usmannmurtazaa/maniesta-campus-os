[build]
  command = "npm run build"
  publish = "build"

# Single Page Application (SPA) rewrites – all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: cache static assets for performance
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"