    <!-- Inline loading indicator – replaced by React on mount -->
    <div id="root">
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f9fafb;">
        <div style="width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
